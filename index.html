<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замовлення Таксі</title>
    <!-- Підключення Leaflet CSS для карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f4f9;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        #map {
            width: 100%;
            height: 180px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 10px;
        }
        .price-box {
            background: #e8f4fd;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 12px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <h2>Замовити Таксі</h2>

    <div class="form-group">
        <label for="address_from">Звідки (Адреса або точка):</label>
        <input type="text" id="address_from" placeholder="Введіть вулицю або натисніть на карту" value="Кобеляки, центр">
    </div>

    <div class="form-group">
        <label for="address_to">Куди (Пункт призначення):</label>
        <input type="text" id="address_to" placeholder="Введіть село, місто або адресу призначення">
    </div>

    <div class="form-group">
        <label for="phone">Номер телефону:</label>
        <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
    </div>

    <div class="form-group">
        <label for="payment_method">Спосіб оплати:</label>
        <select id="payment_method">
            <option value="Готівка">💵 Готівка</option>
            <option value="Картка">💳 Картка</option>
        </select>
    </div>

    <div id="map"></div>

    <div class="price-box" id="priceDisplay">
        Розрахунок вартості...
    </div>

    <button id="submitBtn">🚗 Замовити таксі</button>

    <!-- Leaflet JS для роботи з картами та відстанню -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Центр Кобеляк
        const centerLat = 49.1435;
        const centerLng = 34.2015;

        // Фіксовані тарифи для населених пунктів
        const fixedTariffs = {
            "бутенки": 350,
            "мідянівка": 240,
            "білики": 350,
            "орлик": 1000,
            "жуки": 450,
            "придніпрянське": 1300,
            "радянське": 1300,
            "полтава": 1500,
            "дніпро": 2700,
            "світлогірськ": 1000,
            "василівка": 550,
            "миколаївка": 500,
            "бродщина": 500,
            "красне": 250,
            "кунівка": 200,
            "ганжівка": 200,
            "ліщинівка": 250,
            "галі": 300,
            "вільховатка": 650,
            "деменки": 670,
            "дашківка": 700,
            "сухинівка": 350,
            "шенгури": 500,
            "перегонівка": 450,
            "гарбузівка": 400,
            "соснівка": 400,
            "гайове": 300,
            "рубани": 550,
            "дрижина": 550,
            "марківка": 550,
            "трояни": 500,
            "вітрова балка": 500
        };

        // Ініціалізація карти
        const map = L.map('map').setView([centerLat, centerLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let marker = L.marker([centerLat, centerLng], {draggable: true}).addTo(map);

        // Функція для розрахунку відстані між двома точками в кілометрах (формула гаверсинусів)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            let R = 6371; // Радіус Землі в км
            let dLat = deg2rad(lat2 - lat1);
            let dLon = deg2rad(lon2 - lon1);
            let a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        function calculatePrice(destText, lat = null, lon = null) {
            let cleanText = destText.toLowerCase().trim();
            let price = 100;
            let priceDesc = "По місту / До 2.5 км";

            let foundFixed = false;
            for (let village in fixedTariffs) {
                if (cleanText.includes(village)) {
                    price = fixedTariffs[village];
                    priceDesc = `Фіксований тариф (${village.charAt(0).toUpperCase() + village.slice(1)})`;
                    foundFixed = true;
                    break;
                }
            }

            if (!foundFixed) {
                let distance = 0;
                if (lat !== null && lon !== null) {
                    distance = getDistanceFromLatLonInKm(centerLat, centerLng, lat, lon);
                } else {
                    distance = 3.5; // За замовчуванням, якщо координати не передані
                }

                let baseDistance = 2.5; // Базова зона 2.5 км
                let basePrice = 100;
                let perKmRate = 25;

                if (distance <= baseDistance) {
                    price = basePrice;
                    priceDesc = "По місту / До 2.5 км";
                } else {
                    let extraKm = distance - baseDistance;
                    price = basePrice + Math.round(extraKm * perKmRate);
                    priceDesc = `За містом (~${Math.round(distance)} км)`;
                }
            }

            // Нічний тариф (23:50 – 05:00) x2
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTimeMins = hours * 60 + minutes;
            const nightStart = 23 * 60 + 50; 
            const nightEnd = 5 * 60;       

            if (currentTimeMins >= nightStart || currentTimeMins < nightEnd) {
                price *= 2;
                priceDesc += " (Нічний тариф x2)";
            }

            document.getElementById('priceDisplay').innerText = `Вартість: ${price} грн (${priceDesc})`;
            return { price, priceDesc };
        }

        // Обробка кліку або переміщення мітки на карті
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            let lat = e.latlng.lat;
            let lon = e.latlng.lng;
            document.getElementById('address_to').value = `Точка на карті (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
            calculatePrice(document.getElementById('address_to').value, lat, lon);
        });

        marker.on('dragend', function(e) {
            let pos = marker.getLatLng();
            let lat = pos.lat;
            let lon = pos.lng;
            document.getElementById('address_to').value = `Точка на карті (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
            calculatePrice(document.getElementById('address_to').value, lat, lon);
        });

        document.getElementById('address_to').addEventListener('input', function() {
            let pos = marker.getLatLng();
            calculatePrice(this.value, pos.lat, pos.lng);
        });

        calculatePrice("", centerLat, centerLng);

        document.getElementById('submitBtn').addEventListener('click', function() {
            const addressFrom = document.getElementById('address_from').value;
            const addressTo = document.getElementById('address_to').value;
            const phone = document.getElementById('phone').value;
            const paymentMethod = document.getElementById('payment_method').value;

            if (!addressTo || !phone) {
                alert('Будь ласка, введіть пункт призначення та номер телефону!');
                return;
            }

            let pos = marker.getLatLng();
            const calculation = calculatePrice(addressTo, pos.lat, pos.lng);

            const orderData = {
                address_from: addressFrom,
                address_to: addressTo,
                phone: phone,
                payment_method: paymentMethod,
                price: calculation.price,
                price_desc: calculation.priceDesc
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
