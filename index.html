<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Замовлення Таксі - Кобеляки</title>
    <!-- Підключення Leaflet CSS для карти -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
            color: #333;
        }
        #map {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .instruction {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #b9770e;
            margin-bottom: 6px;
        }
        .form-group {
            margin-bottom: 6px;
        }
        label {
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
            font-size: 11px;
            color: #555;
        }
        .input-row {
            display: flex;
            gap: 5px;
        }
        input, select {
            width: 100%;
            padding: 7px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .action-btn {
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-from {
            background-color: #3498db;
        }
        .btn-to {
            background-color: #95a5a6;
        }
        .gps-btn {
            width: 100%;
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .price-box {
            background: #e8f4fd;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 8px;
        }
        .submit-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- МАПА ЗВЕРХУ -->
    <div class="instruction" id="mapInstruction">👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)</div>
    <div id="map"></div>

    <!-- ЕЛЕМЕНТИ КЕРУВАННЯ ПІД МАПОЮ -->
    <div class="form-group">
        <label>📞 Ваш номер телефону</label>
        <input type="tel" id="phone" placeholder="0955331538">
    </div>

    <div class="form-group">
        <label>📍 Звідки забирати?</label>
        <div class="input-row">
            <input type="text" id="address_from" value="Кобеляки, центр" placeholder="Вулиця або орієнтир">
            <button type="button" class="action-btn btn-from" id="setFromBtn">Ар. Звідки</button>
        </div>
    </div>

    <div class="form-group">
        <label>🏁 Куди їдемо?</label>
        <div class="input-row">
            <input type="text" id="address_to" placeholder="Пункт призначення (вулиця або село)">
            <button type="button" class="action-btn btn-to" id="setToBtn">Ар. Куди</button>
        </div>
    </div>

    <div class="form-group">
        <label for="payment_method">💳 Спосіб оплати:</label>
        <select id="payment_method">
            <option value="Готівка">💵 Готівка</option>
            <option value="Картка">💳 Картка</option>
        </select>
    </div>

    <button type="button" class="gps-btn" id="gpsBtn">📍 Визначити моє положення (GPS)</button>

    <div class="price-box" id="priceDisplay">
        Розрахунок вартості...
    </div>

    <button type="button" class="submit-btn" id="submitBtn">🚗 Замовити таксі</button>

    <!-- Leaflet JS для роботи з картами -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Центр Кобеляк
        const centerLat = 49.1435;
        const centerLng = 34.2015;

        // Фіксовані тарифи
        const fixedTariffs = {
            "бутенки": 350, "мідянівка": 240, "білики": 350, "орлик": 1000,
            "жуки": 450, "придніпрянське": 1300, "радянське": 1300, "полтава": 1500,
            "дніпро": 2700, "світлогірськ": 1000, "василівка": 550, "миколаївка": 500,
            "бродщина": 500, "красне": 250, "кунівка": 200, "ганжівка": 200,
            "ліщинівка": 250, "галі": 300, "вільховатка": 650, "деменки": 670,
            "дашківка": 700, "сухинівка": 350, "шенгури": 500, "перегонівка": 450,
            "гарбузівка": 400, "соснівка": 400, "гайове": 300, "рубани": 550,
            "дрижина": 550, "марківка": 550, "трояни": 500, "вітрова балка": 500
        };

        const map = L.map('map').setView([centerLat, centerLng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let marker = L.marker([centerLat, centerLng], {draggable: true}).addTo(map);
        let selectingMode = 'from';

        function updateInstruction() {
            const instr = document.getElementById('mapInstruction');
            if (selectingMode === 'from') {
                instr.innerText = "👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)";
                instr.style.color = "#3498db";
                document.getElementById('setFromBtn').style.opacity = "1";
                document.getElementById('setToBtn').style.opacity = "0.6";
            } else {
                instr.innerText = "👉 Оберіть на мапі точку ПРИЗНАЧЕННЯ (Куди)";
                instr.style.color = "#e67e22";
                document.getElementById('setFromBtn').style.opacity = "0.6";
                document.getElementById('setToBtn').style.opacity = "1";
            }
        }

        document.getElementById('setFromBtn').addEventListener('click', function() {
            selectingMode = 'from';
            updateInstruction();
        });

        document.getElementById('setToBtn').addEventListener('click', function() {
            selectingMode = 'to';
            updateInstruction();
        });

        // Функція для отримання назви вулиці за координатами через Nominatim
        function getAddressFromLatLon(lat, lon, callback) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                headers: { 'Accept-Language': 'uk' }
            })
            .then(response => response.json())
            .then(data => {
                if (data && data.address) {
                    let road = data.address.road || data.address.pedestrian || data.address.suburb || '';
                    let houseNumber = data.address.house_number ? `, ${data.address.house_number}` : '';
                    let city = data.address.city || data.address.town || data.address.village || data.address.county || 'Кобеляки';
                    
                    let fullAddress = road ? `${road}${houseNumber}, ${city}` : `${city}`;
                    callback(fullAddress);
                } else {
                    callback(`Кобеляки (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
                }
            })
            .catch(() => {
                callback(`Кобеляки (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
            });
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            let R = 6371; 
            let dLat = deg2rad(lat2 - lat1);
            let dLon = deg2rad(lon2 - lon1);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function deg2rad(deg) { return deg * (Math.PI/180); }

        function calculatePrice(destText, lat = null, lon = null) {
            let cleanText = destText.toLowerCase().trim();
            let price = 100;
            let priceDesc = "По місту / До 2.5 км";

            let foundFixed = false;
            for (let village in fixedTariffs) {
                if (cleanText.includes(village)) {
                    price = fixedTariffs[village];
                    priceDesc = `Фіксований тариф (${village.charAt(0).toUpperCase() + village.slice(1)})`;
                    foundFixed = true;
                    break;
                }
            }

            if (!foundFixed) {
                let distance = (lat !== null && lon !== null) ? getDistanceFromLatLonInKm(centerLat, centerLng, lat, lon) : 3.5;
                let baseDistance = 2.5; 
                let basePrice = 100;
                let perKmRate = 25;

                if (distance <= baseDistance) {
                    price = basePrice;
                    priceDesc = "По місту / До 2.5 км";
                } else {
                    let extraKm = distance - baseDistance;
                    price = basePrice + Math.round(extraKm * perKmRate);
                    priceDesc = `За містом (~${Math.round(distance)} км)`;
                }
            }

            const now = new Date();
            const currentTimeMins = now.getHours() * 60 + now.getMinutes();
            if (currentTimeMins >= (23 * 60 + 50) || currentTimeMins < (5 * 60)) {
                price *= 2;
                priceDesc += " (Нічний тариф x2)";
            }

            document.getElementById('priceDisplay').innerText = `Вартість: ${price} грн (${priceDesc})`;
            return { price, priceDesc };
        }

        // Клік по мапі
        map.on('click', function(e) {
            let lat = e.latlng.lat;
            let lon = e.latlng.lng;
            marker.setLatLng([lat, lon]);

            getAddressFromLatLon(lat, lon, function(addressText) {
                if (selectingMode === 'from') {
                    document.getElementById('address_from').value = addressText;
                } else {
                    document.getElementById('address_to').value = addressText;
                    calculatePrice(addressText, lat, lon);
                }
            });
        });

        // Перетягування мітки
        marker.on('dragend', function(e) {
            let pos = marker.getLatLng();
            let lat = pos.lat;
            let lon = pos.lng;

            getAddressFromLatLon(lat, lon, function(addressText) {
                if (selectingMode === 'from') {
                    document.getElementById('address_from').value = addressText;
                } else {
                    document.getElementById('address_to').value = addressText;
                    calculatePrice(addressText, lat, lon);
                }
            });
        });

        document.getElementById('address_to').addEventListener('input', function() {
            let pos = marker.getLatLng();
            calculatePrice(this.value, pos.lat, pos.lng);
        });

        // Кнопка GPS
        document.getElementById('gpsBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let latLng = [lat, lon];
                    map.setView(latLng, 16);
                    marker.setLatLng(latLng);
                    
                    getAddressFromLatLon(lat, lon, function(addressText) {
                        if (selectingMode === 'from') {
                            document.getElementById('address_from').value = addressText;
                        } else {
                            document.getElementById('address_to').value = addressText;
                            calculatePrice(addressText, lat, lon);
                        }
                    });
                }, function() {
                    alert('Не вдалося отримати геолокацію. Увімкніть GPS.');
                });
            } else {
                alert('Геолокація не підтримується.');
            }
        });

        updateInstruction();
        calculatePrice("", centerLat, centerLng);

        document.getElementById('submitBtn').addEventListener('click', function() {
            const addressFrom = document.getElementById('address_from').value;
            const addressTo = document.getElementById('address_to').value;
            const phone = document.getElementById('phone').value;
            const paymentMethod = document.getElementById('payment_method').value;

            if (!addressFrom || !addressTo || !phone) {
                alert('Будь ласка, заповніть номер телефону, точку "Звідки" та "Куди"!');
                return;
            }

            let pos = marker.getLatLng();
            const calculation = calculatePrice(addressTo, pos.lat, pos.lng);

            const orderData = {
                address_from: addressFrom,
                address_to: addressTo,
                phone: phone,
                payment_method: paymentMethod,
                price: calculation.price,
                price_desc: calculation.priceDesc
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
