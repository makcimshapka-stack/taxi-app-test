<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Замовлення Таксі - Кобеляки</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
            color: #333;
        }
        #map {
            width: 100%;
            height: 220px;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .instruction {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #b9770e;
            margin-bottom: 6px;
        }
        .form-group {
            margin-bottom: 6px;
        }
        label {
            display: block;
            margin-bottom: 2px;
            font-weight: bold;
            font-size: 11px;
            color: #555;
        }
        .input-row {
            display: flex;
            gap: 5px;
        }
        input {
            width: 100%;
            padding: 7px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .action-btn {
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-from {
            background-color: #3498db;
        }
        .btn-to {
            background-color: #95a5a6;
        }
        .gps-btn {
            width: 100%;
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .submit-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="instruction" id="mapInstruction">👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)</div>
    <div id="map"></div>

    <div class="form-group">
        <label>📞 Ваш номер телефону</label>
        <input type="tel" id="phone" placeholder="0955331538">
    </div>

    <div class="form-group">
        <label>📍 Звідки забирати?</label>
        <div class="input-row">
            <input type="text" id="address_from" placeholder="Вулиця, будинок або орієнтир">
            <button type="button" class="action-btn btn-from" id="setFromBtn">Ар. Звідки</button>
        </div>
    </div>

    <div class="form-group">
        <label>🏁 Куди їдемо?</label>
        <div class="input-row">
            <input type="text" id="address_to" placeholder="Пункт призначення">
            <button type="button" class="action-btn btn-to" id="setToBtn">Ар. Куди</button>
        </div>
    </div>

    <button type="button" class="gps-btn" id="gpsBtn">📍 Визначити моє положення (GPS)</button>
    <button type="button" class="submit-btn" id="submitBtn">Підтвердити замовлення</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const centerLat = 49.1435;
        const centerLng = 34.2015;

        const map = L.map('map').setView([centerLat, centerLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/*.png', {
            maxZoom: 19,
        }).addTo(map);

        let marker = L.marker([centerLat, centerLng], {draggable: true}).addTo(map);
        let selectingMode = 'from';

        function updateInstruction() {
            const instr = document.getElementById('mapInstruction');
            if (selectingMode === 'from') {
                instr.innerText = "👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)";
                instr.style.color = "#3498db";
            } else {
                instr.innerText = "👉 Оберіть на мапі точку ПРИЗНАЧЕННЯ (Куди)";
                instr.style.color = "#e67e22";
            }
        }

        document.getElementById('setFromBtn').addEventListener('click', function() {
            selectingMode = 'from';
            updateInstruction();
        });

        document.getElementById('setToBtn').addEventListener('click', function() {
            selectingMode = 'to';
            updateInstruction();
        });

        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            let lat = e.latlng.lat.toFixed(4);
            let lon = e.latlng.lng.toFixed(4);
            let pointText = `Точка на мапі (${lat}, ${lon})`;

            if (selectingMode === 'from') {
                document.getElementById('address_from').value = pointText;
            } else {
                document.getElementById('address_to').value = pointText;
            }
        });

        marker.on('dragend', function(e) {
            let pos = marker.getLatLng();
            let lat = pos.lat.toFixed(4);
            let lon = pos.lng.toFixed(4);
            let pointText = `Точка на мапі (${lat}, ${lon})`;

            if (selectingMode === 'from') {
                document.getElementById('address_from').value = pointText;
            } else {
                document.getElementById('address_to').value = pointText;
            }
        });

        document.getElementById('gpsBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    let latLng = [lat, lon];
                    map.setView(latLng, 16);
                    marker.setLatLng(latLng);
                    
                    let pointText = `GPS (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                    if (selectingMode === 'from') {
                        document.getElementById('address_from').value = pointText;
                    } else {
                        document.getElementById('address_to').value = pointText;
                    }
                }, function() {
                    alert('Не вдалося отримати геолокацію.');
                });
            } else {
                alert('Геолокація не підтримується.');
            }
        });

        document.getElementById('submitBtn').addEventListener('click', function() {
            const addressFrom = document.getElementById('address_from').value;
            const addressTo = document.getElementById('address_to').value;
            const phone = document.getElementById('phone').value;

            if (!addressFrom || !addressTo || !phone) {
                alert('Будь ласка, заповніть номер телефону, точку "Звідки" та "Куди"!');
                return;
            }

            const orderData = {
                address_from: addressFrom,
                address_to: addressTo,
                phone: phone,
                price: 100,
                price_desc: "По місту"
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>
