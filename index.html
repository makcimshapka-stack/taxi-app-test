<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Замовлення Таксі - Кобеляки</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #f5f5f5; overflow: hidden; }
        #map { width: 100%; height: 38vh; }
        .panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 62vh; background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 10px 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .input-group { margin-bottom: 5px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: #777; }
        .input-row { display: flex; gap: 6px; }
        .input-group input { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 13px; outline: none; }
        .input-group input:focus { border-color: #2481cc; }
        .action-btn { background: #e0e0e0; border: none; border-radius: 10px; padding: 0 10px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .action-btn.active { background: #2481cc; color: #fff; }
        .geo-btn { width: 100%; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; padding: 5px; font-size: 11px; font-weight: 600; cursor: pointer; margin-bottom: 5px; color: #333; text-align: center; }
        .order-btn { width: 100%; padding: 10px; background-color: #2ea44f; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .map-hint { font-size: 11px; color: #e67e22; text-align: center; margin-bottom: 2px; font-weight: bold; min-height: 14px; }
        .price-box { background: #eef9f0; border: 1px solid #d1e7dd; border-radius: 10px; padding: 6px; text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <div>
            <div class="map-hint" id="mapHint">📍 Клікніть на карту або введіть адресу нижче</div>

            <div class="input-group">
                <label for="phone">📞 Ваш номер телефону</label>
                <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
            </div>

            <div class="input-group">
                <label for="addressFrom">📍 Звідки забирати?</label>
                <div class="input-row">
                    <input type="text" id="addressFrom" placeholder="Вулиця, будинок або орієнтир">
                    <button type="button" class="action-btn" id="setFromBtn" onclick="setMode('from')">Ар. Звідки</button>
                </div>
            </div>
            
            <div class="input-group">
                <label for="addressTo">🏁 Куди їдемо?</label>
                <div class="input-row">
                    <input type="text" id="addressTo" placeholder="Пункт призначення">
                    <button type="button" class="action-btn" id="setToBtn" onclick="setMode('to')">Ар. Куди</button>
                </div>
            </div>

            <button type="button" class="geo-btn" onclick="useCurrentLocation()">📍 Визначити моє положення (GPS)</button>

            <!-- Кнопки вибору тарифу -->
            <div style="margin-bottom: 4px;">
                <label style="display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: #777;">🏷️ Виберіть напрямок:</label>
                <div style="display: flex; gap: 3px; flex-wrap: wrap;">
                    <button type="button" id="tariffCity" class="action-btn active" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('city')">Місто (100)</button>
                    <button type="button" id="tariffBridge" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('bridge')">Міст (150)</button>
                    <button type="button" id="tariffHanz" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('ganzhivka')">Ганжівка (150)</button>
                    <button type="button" id="tariffEdn" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('ednannya')">Єднання (230)</button>
                    <button type="button" id="tariffLish" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('lishynivka')">Ліщинівка (230)</button>
                    <button type="button" id="tariffMid" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('midianivka')">Мідянівка (250)</button>
                    <button type="button" id="tariffSukh" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('sukhinivka')">Сухинівка (300)</button>
                    <button type="button" id="tariffBil" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('bilyky')">Білики (400)</button>
                    <button type="button" id="tariffPer" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('perehonivka')">Перегонівка (450)</button>
                    <button type="button" id="tariffOut" class="action-btn" style="flex: 1; min-width: 30%; padding: 5px; font-size: 10px;" onclick="setTariff('outskirt')">Інше (25 грн/км)</button>
                </div>
            </div>

            <div class="price-box">
                <div id="priceDisplay" style="font-size: 15px; font-weight: bold; color: #198754;">100 грн (По місту)</div>
            </div>
        </div>

        <button class="order-btn" onclick="submitOrder()">Підтвердити замовлення</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentMode = 'from';
        let fromCoords = null;
        let toCoords = null;
        let finalPrice = 100;
        let priceDescription = "По місту Кобеляки";
        let currentTariffType = 'city';

        const kobelyakyCoords = [49.1435, 34.2015];
        const map = L.map('map').setView(kobelyakyCoords, 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let fromMarker = null;
        let toMarker = null;

        window.onload = function() {
            let savedPhone = localStorage.getItem("taxi_user_phone");
            if (savedPhone) {
                document.getElementById('phone').value = savedPhone;
            }
            updateModeUI();
            calculatePrice();
        };

        function setMode(mode) {
            currentMode = mode;
            updateModeUI();
        }

        function updateModeUI() {
            const hint = document.getElementById('mapHint');
            const btnFrom = document.getElementById('setFromBtn');
            const btnTo = document.getElementById('setToBtn');

            if (currentMode === 'from') {
                hint.innerText = "👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)";
                btnFrom.classList.add('active');
                btnTo.classList.remove('active');
            } else {
                hint.innerText = "👉 Оберіть на мапі точку ПРИЗНАЧЕННЯ (Куди)";
                btnTo.classList.add('active');
                btnFrom.classList.remove('active');
            }
        }

        function setTariff(type) {
            currentTariffType = type;
            
            ['city', 'bridge', 'ganzhivka', 'ednannya', 'lishynivka', 'midianivka', 'sukhinivka', 'bilyky', 'perehonivka', 'outskirt'].forEach(t => {
                let el = document.getElementById(getTariffElementId(t));
                if(el) el.classList.remove('active');
            });

            let activeEl = document.getElementById(getTariffElementId(type));
            if(activeEl) activeEl.classList.add('active');

            calculatePrice();
        }

        function getTariffElementId(type) {
            switch(type) {
                case 'city': return 'tariffCity';
                case 'bridge': return 'tariffBridge';
                case 'ganzhivka': return 'tariffHanz';
                case 'ednannya': return 'tariffEdn';
                case 'lishynivka': return 'tariffLish';
                case 'midianivka': return 'tariffMid';
                case 'sukhinivka': return 'tariffSukh';
                case 'bilyky': return 'tariffBil';
                case 'perehonivka': return 'tariffPer';
                case 'outskirt': return 'tariffOut';
            }
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (currentMode === 'from') {
                fromCoords = {lat, lng};
                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker([lat, lng], {draggable: true}).addTo(map).bindPopup("Звідки").openPopup();
                reverseGeocode(lat, lng, 'addressFrom');
            } else {
                toCoords = {lat, lng};
                if (toMarker) map.removeLayer(toMarker);
                toMarker = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.4/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                    }),
                    draggable: true
                }).addTo(map).bindPopup("Куди").openPopup();
                reverseGeocode(lat, lng, 'addressTo');
            }
            calculatePrice();
        });

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            let R = 6371;
            let dLat = (lat2 - lat1) * (Math.PI/180);
            let dLon = (lon2 - lon1) * (Math.PI/180);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculatePrice() {
            let basePrice = 100;
            let desc = "По місту Кобеляки";

            switch(currentTariffType) {
                case 'city':
                    basePrice = 100;
                    desc = "По місту Кобеляки";
                    break;
                case 'bridge':
                    basePrice = 150;
                    desc = "Через міст (Ворскла / Кобелячка)";
                    break;
                case 'ganzhivka':
                    basePrice = 150;
                    desc = "с. Ганжівка";
                    break;
                case 'ednannya':
                    basePrice = 230;
                    desc = "с. Єднання";
                    break;
                case 'lishynivka':
                    basePrice = 230;
                    desc = "с. Ліщинівка";
                    break;
                case 'midianivka':
                    basePrice = 250;
                    desc = "с. Мідянівка";
                    break;
                case 'sukhinivka':
                    basePrice = 300;
                    desc = "с. Сухинівка";
                    break;
                case 'bilyky':
                    basePrice = 400;
                    desc = "смт Білики";
                    break;
                case 'perehonivka':
                    basePrice = 450;
                    desc = "с. Перегонівка";
                    break;
                case 'outskirt':
                    if (toCoords) {
                        // Центр Кобеляк: 49.1435, 34.2015
                        let distFromCenter = getDistanceFromLatLonInKm(49.1435, 34.2015, toCoords.lat, toCoords.lng);
                        if (distFromCenter > 2.5) {
                            let extraKm = distFromCenter - 2.5;
                            basePrice = Math.round(100 + (extraKm * 25));
                            desc = `За містом (~${distFromCenter.toFixed(1)} км, після 2.5 км по 25 грн/км)`;
                        } else {
                            basePrice = 100;
                            desc = "В межах 2.5 км від центру";
                        }
                    } else {
                        basePrice = 100;
                        desc = "За містом (вкажіть точку на мапі)";
                    }
                    break;
            }

            // Нічний тариф (після 23:50 до 05:00)
            let now = new Date();
            let totalMinutes = now.getHours() * 60 + now.getMinutes();
            let isNight = (totalMinutes >= 23 * 60 + 50) || (totalMinutes < 5 * 60);

            if (isNight) {
                basePrice *= 2;
                desc += " (Нічний тариф ×2)";
            }

            finalPrice = basePrice;
            priceDescription = desc;
            document.getElementById('priceDisplay').innerText = `${finalPrice} грн (${desc})`;
        }

        function reverseGeocode(lat, lng, elementId) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                headers: { 'Accept-Language': 'uk' }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.display_name) {
                    let parts = data.display_name.split(',');
                    let shortAddress = parts.slice(0, 3).join(',').trim();
                    document.getElementById(elementId).value = shortAddress;
                } else {
                    document.getElementById(elementId).value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }
            })
            .catch(() => {
                document.getElementById(elementId).value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        }

        function useCurrentLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 16);
                    currentMode = 'from';
                    fromCoords = {lat, lng};
                    if (fromMarker) map.removeLayer(fromMarker);
                    fromMarker = L.marker([lat, lng]).addTo(map).bindPopup("Я тут").openPopup();
                    reverseGeocode(lat, lng, 'addressFrom');
                    calculatePrice();
                }, function() {
                    alert("Не вдалося отримати геолокацію.");
                }, {enableHighAccuracy: true});
            } else {
                alert("Геолокація не підтримується.");
            }
        }

        function submitOrder() {
            const phone = document.getElementById('phone').value.trim();
            const addressFrom = document.getElementById('addressFrom').value.trim();
            const addressTo = document.getElementById('addressTo').value.trim();

            if (!phone || phone.length < 9) {
                alert("Введіть номер телефону!");
                return;
            }
            if (!addressFrom || !addressTo) {
                alert("Вкажіть адреси Звідки та Куди!");
                return;
            }

            localStorage.setItem("taxi_user_phone", phone);

            const orderData = {
                phone: phone,
                address_from: addressFrom,
                address_to: addressTo,
                price: finalPrice,
                price_desc: priceDescription,
                lat: fromCoords ? fromCoords.lat : null,
                lng: fromCoords ? fromCoords.lng : null
            };

            if (window.Telegram && window.Telegram.WebApp) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert("Відкривайте додаток через Telegram!");
            }
        }
    </script>
</body>
</html>
