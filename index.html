<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Замовлення Таксі - Кобеляки</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background: #f5f5f5; overflow: hidden; }
        #map { width: 100%; height: 36vh; }
        .panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 64vh; background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 10px 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
        .input-group { margin-bottom: 4px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: #777; }
        .input-row { display: flex; gap: 6px; }
        .input-group input { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 13px; outline: none; }
        .input-group input:focus { border-color: #2481cc; }
        .action-btn { background: #e0e0e0; border: none; border-radius: 10px; padding: 0 10px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .action-btn.active { background: #2481cc; color: #fff; }
        .geo-btn { width: 100%; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; padding: 5px; font-size: 11px; font-weight: 600; cursor: pointer; margin-bottom: 4px; color: #333; text-align: center; }
        .order-btn { width: 100%; padding: 10px; background-color: #2ea44f; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
        .map-hint { font-size: 11px; color: #e67e22; text-align: center; margin-bottom: 2px; font-weight: bold; min-height: 14px; }
        .price-box { background: #eef9f0; border: 1px solid #d1e7dd; border-radius: 10px; padding: 6px; text-align: center; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="panel">
        <div>
            <div class="map-hint" id="mapHint">📍 Клікніть на карту або введіть адресу нижче</div>

            <div class="input-group">
                <label for="phone">📞 Ваш номер телефону</label>
                <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
            </div>

            <div class="input-group">
                <label for="addressFrom">📍 Звідки забирати?</label>
                <div class="input-row">
                    <input type="text" id="addressFrom" placeholder="Вулиця, будинок або орієнтир">
                    <button type="button" class="action-btn" id="setFromBtn" onclick="setMode('from')">Ар. Звідки</button>
                </div>
            </div>
            
            <div class="input-group">
                <label for="addressTo">🏁 Куди їдемо?</label>
                <div class="input-row">
                    <input type="text" id="addressTo" placeholder="Пункт призначення">
                    <button type="button" class="action-btn" id="setToBtn" onclick="setMode('to')">Ар. Куди</button>
                </div>
            </div>

            <button type="button" class="geo-btn" onclick="useCurrentLocation()">📍 Визначити моє положення (GPS)</button>

            <!-- Кнопки вибору тарифу -->
            <div style="margin-bottom: 4px;">
                <label style="display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: #777;">🏷️ Виберіть напрямок:</label>
                <div style="display: flex; gap: 3px; flex-wrap: wrap; max-height: 115px; overflow-y: auto; padding-right: 2px;">
                    <button type="button" id="tariffCity" class="action-btn active" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('city')">Місто (100)</button>
                    <button type="button" id="tariffBridge" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('bridge')">Міст (150)</button>
                    <button type="button" id="tariffKrasna" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('krasna')">Красна (250)</button>
                    <button type="button" id="tariffRidne" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('ridne')">Рідне / Кунівка (200)</button>
                    <button type="button" id="tariffGanz" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('ganzhivka')">Ганжівка (200)</button>
                    <button type="button" id="tariffLish" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('lishynivka')">Ліщинівка (250)</button>
                    <button type="button" id="tariffBut" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('butenky')">Бутенки (350)</button>
                    <button type="button" id="tariffBil" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('bilyky')">Білики (350)</button>
                    <button type="button" id="tariffGali" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('gali')">Галі (300)</button>
                    <button type="button" id="tariffPol" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('polissya')">Полісся / Сухинівка (350)</button>
                    <button type="button" id="tariffGar" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('garbuzivka')">Гарбузівка (400)</button>
                    <button type="button" id="tariffSosn" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('sosnivka')">Соснівка (400)</button>
                    <button type="button" id="tariffZhuky" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('zhuky')">Жуки (450)</button>
                    <button type="button" id="tariffPer" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('perehonivka')">Перегонівка (450)</button>
                    <button type="button" id="tariffMik" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('mykolaivka')">Миколаївка (500)</button>
                    <button type="button" id="tariffBrod" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('brodshchyna')">Бродщина (500)</button>
                    <button type="button" id="tariffShen" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('shengury')">Шенгури (500)</button>
                    <button type="button" id="tariffTroy" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('troyany')">Трояни (500)</button>
                    <button type="button" id="tariffVit" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('vitrova_balka')">Вітрова Балка (500)</button>
                    <button type="button" id="tariffVas" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('vasylivka')">Василівка (550)</button>
                    <button type="button" id="tariffRub" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('rubany')">Рубани (550)</button>
                    <button type="button" id="tariffDryz" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('dryzhyna')">Дрижина (550)</button>
                    <button type="button" id="tariffMark" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('markivka')">Марківка (550)</button>
                    <button type="button" id="tariffGay" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('gayove')">Гайове (300)</button>
                    <button type="button" id="tariffVil" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('vilhovatka')">Вільховатка (650)</button>
                    <button type="button" id="tariffDem" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('demenky')">Деменки (670)</button>
                    <button type="button" id="tariffDash" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('dashkivka')">Дашківка (700)</button>
                    <button type="button" id="tariffOrl" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('orlyk')">Орлик (1000)</button>
                    <button type="button" id="tariffSvit" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('svitohirsk')">Світлогірськ (1000)</button>
                    <button type="button" id="tariffPrid" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('pridniprianske')">Придніпрянське / Радянське (1300)</button>
                    <button type="button" id="tariffPolt" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('poltava')">Полтава (1500)</button>
                    <button type="button" id="tariffDnipro" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('dnipro')">Дніпро (3000)</button>
                    <button type="button" id="tariffOut" class="action-btn" style="min-width: 30%; flex: 1; padding: 4px; font-size: 10px;" onclick="setTariff('outskirt')">Інше (25 грн/км)</button>
                </div>
            </div>

            <div class="price-box">
                <div id="priceDisplay" style="font-size: 15px; font-weight: bold; color: #198754;">100 грн (По місту)</div>
            </div>
        </div>

        <button class="order-btn" onclick="submitOrder()">Підтвердити замовлення</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentMode = 'from';
        let fromCoords = null;
        let toCoords = null;
        let finalPrice = 100;
        let priceDescription = "По місту Кобеляки";
        let currentTariffType = 'city';

        const kobelyakyCoords = [49.1435, 34.2015];
        const map = L.map('map').setView(kobelyakyCoords, 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let fromMarker = null;
        let toMarker = null;

        const allTariffs = [
            'city', 'bridge', 'krasna', 'ridne', 'ganzhivka', 'lishynivka', 'butenky', 
            'bilyky', 'gali', 'polissya', 'garbuzivka', 'sosnivka', 'zhuky', 'perehonivka', 
            'mykolaivka', 'brodshchyna', 'shengury', 'troyany', 'vitrova_balka', 'vasylivka', 
            'rubany', 'dryzhyna', 'markivka', 'gayove', 'vilhovatka', 'demenky', 'dashkivka', 
            'orlyk', 'svitohirsk', 'pridniprianske', 'poltava', 'dnipro', 'outskirt'
        ];

        window.onload = function() {
            let savedPhone = localStorage.getItem("taxi_user_phone");
            if (savedPhone) {
                document.getElementById('phone').value = savedPhone;
            }
            updateModeUI();
            calculatePrice();
        };

        function setMode(mode) {
            currentMode = mode;
            updateModeUI();
        }

        function updateModeUI() {
            const hint = document.getElementById('mapHint');
            const btnFrom = document.getElementById('setFromBtn');
            const btnTo = document.getElementById('setToBtn');

            if (currentMode === 'from') {
                hint.innerText = "👉 Оберіть на мапі точку ВІДКРИТТЯ (Звідки)";
                btnFrom.classList.add('active');
                btnTo.classList.remove('active');
            } else {
                hint.innerText = "👉 Оберіть на мапі точку ПРИЗНАЧЕННЯ (Куди)";
                btnTo.classList.add('active');
                btnFrom.classList.remove('active');
            }
        }

        function setTariff(type) {
            currentTariffType = type;
            
            allTariffs.forEach(t => {
                let el = document.getElementById(getTariffElementId(t));
                if(el) el.classList.remove('active');
            });

            let activeEl = document.getElementById(getTariffElementId(type));
            if(activeEl) activeEl.classList.add('active');

            calculatePrice();
        }

        function getTariffElementId(type) {
            switch(type) {
                case 'city': return 'tariffCity';
                case 'bridge': return 'tariffBridge';
                case 'krasna': return 'tariffKrasna';
                case 'ridne': return 'tariffRidne';
                case 'ganzhivka': return 'tariffGanz';
                case 'lishynivka': return 'tariffLish';
                case 'butenky': return 'tariffBut';
                case 'bilyky': return 'tariffBil';
                case 'gali': return 'tariffGali';
                case 'polissya': return 'tariffPol';
                case 'garbuzivka': return 'tariffGar';
                case 'sosnivka': return 'tariffSosn';
                case 'zhuky': return 'tariffZhuky';
                case 'perehonivka': return 'tariffPer';
                case 'mykolaivka': return 'tariffMik';
                case 'brodshchyna': return 'tariffBrod';
                case 'shengury': return 'tariffShen';
                case 'troyany': return 'tariffTroy';
                case 'vitrova_balka': return 'tariffVit';
                case 'vasylivka': return 'tariffVas';
                case 'rubany': return 'tariffRub';
                case 'dryzhyna': return 'tariffDryz';
                case 'markivka': return 'tariffMark';
                case 'gayove': return 'tariffGay';
                case 'vilhovatka': return 'tariffVil';
                case 'demenky': return 'tariffDem';
                case 'dashkivka': return 'tariffDash';
                case 'orlyk': return 'tariffOrl';
                case 'svitohirsk': return 'tariffSvit';
                case 'pridniprianske': return 'tariffPrid';
                case 'poltava': return 'tariffPolt';
                case 'dnipro': return 'tariffDnipro';
                case 'outskirt': return 'tariffOut';
            }
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            if (currentMode === 'from') {
                fromCoords = {lat, lng};
                if (fromMarker) map.removeLayer(fromMarker);
                fromMarker = L.marker([lat, lng], {draggable: true}).addTo(map).bindPopup("Звідки").openPopup();
                reverseGeocode(lat, lng, 'addressFrom');
            } else {
                toCoords = {lat, lng};
                if (toMarker) map.removeLayer(toMarker);
                toMarker = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.4/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
                    }),
                    draggable: true
                }).addTo(map).bindPopup("Куди").openPopup();
                reverseGeocode(lat, lng, 'addressTo');
            }
            calculatePrice();
        });

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            let R = 6371;
            let dLat = (lat2 - lat1) * (Math.PI/180);
            let dLon = (lon2 - lon1) * (Math.PI/180);
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculatePrice() {
            let basePrice = 100;
            let desc = "По місту Кобеляки";

            switch(currentTariffType) {
                case 'city': basePrice = 100; desc = "По місту Кобеляки"; break;
                case 'bridge': basePrice = 150; desc = "Через міст (Ворскла / Кобелячка)"; break;
                case 'krasna': basePrice = 250; desc = "с. Красна"; break;
                case 'ridne': basePrice = 200; desc = "с. Рідне (Кунівка)"; break;
                case 'ganzhivka': basePrice = 200; desc = "с. Ганжівка"; break;
                case 'lishynivka': basePrice = 250; desc = "с. Ліщинівка"; break;
                case 'butenky': basePrice = 350; desc = "с. Бутенки"; break;
                case 'bilyky': basePrice = 350; desc = "смт Білики"; break;
                case 'gali': basePrice = 300; desc = "с. Галі"; break;
                case 'polissya': basePrice = 350; desc = "с. Полісся (Сухинівка)"; break;
                case 'garbuzivka': basePrice = 400; desc = "с. Гарбузівка"; break;
                case 'sosnivka': basePrice = 400; desc = "с. Соснівка"; break;
                case 'zhuky': basePrice = 450; desc = "с. Жуки"; break;
                case 'perehonivka': basePrice = 450; desc = "с. Перегонівка"; break;
                case 'mykolaivka': basePrice = 500; desc = "с. Миколаївка"; break;
                case 'brodshchyna': basePrice = 500; desc = "с. Бродщина"; break;
                case 'shengury': basePrice = 500; desc = "с. Шенгури"; break;
                case 'troyany': basePrice = 500; desc = "с. Трояни"; break;
                case 'vitrova_balka': basePrice = 500; desc = "с. Вітрова Балка"; break;
                case 'vasylivka': basePrice = 550; desc = "с. Василівка"; break;
                case 'rubany': basePrice = 550; desc = "с. Рубани"; break;
                case 'dryzhyna': basePrice = 550; desc = "с. Дрижина"; break;
                case 'markivka': basePrice = 550; desc = "с. Марківка"; break;
                case 'gayove': basePrice = 300; desc = "с. Гайове"; break;
                case 'vilhovatka': basePrice = 650; desc = "с. Вільховатка"; break;
                case 'demenky': basePrice = 670; desc = "с. Деменки"; break;
                case 'dashkivka': basePrice = 700; desc = "с. Дашківка"; break;
                case 'orlyk': basePrice = 1000; desc = "с. Орлик"; break;
                case 'svitohirsk': basePrice = 1000; desc = "с. Світлогірськ"; break;
                case 'pridniprianske': basePrice = 1300; desc = "с. Придніпрянське (Радянське)"; break;
                case 'poltava': basePrice = 1500; desc = "м. Полтава"; break;
                case 'dnipro': basePrice = 3000; desc = "м. Дніпро"; break;
                case 'outskirt':
                    if (toCoords) {
                        let distFromCenter = getDistanceFromLatLonInKm(49.1435, 34.2015, toCoords.lat, toCoords.lng);
                        if (distFromCenter > 2.5) {
                            let extraKm = distFromCenter - 2.5;
                            basePrice = Math.round(100 + (extraKm * 25));
                            desc = `За містом (~${distFromCenter.toFixed(1)} км, після 2.5 км по 25 грн/км)`;
                        } else {
                            basePrice = 100;
                            desc = "В межах 2.5 км від центру";
                        }
                    } else {
                        basePrice = 100;
                        desc = "За містом (вкажіть точку на мапі)";
                    }
                    break;
            }

            // Нічний тариф (після 23:50 до 05:00)
            let now = new Date();
            let totalMinutes = now.getHours() * 60 + now.getMinutes();
            let isNight = (totalMinutes >= 23 * 60 + 50) || (totalMinutes < 5 * 60);

            if (isNight) {
                basePrice *= 2;
                desc += " (Нічний тариф ×2)";
            }

            finalPrice = basePrice;
            priceDescription = desc;
            document.getElementById('priceDisplay').innerText = `${finalPrice} грн (${desc})`;
        }

        function reverseGeocode(lat, lng, elementId) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                headers: { 'Accept-Language': 'uk' }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.display_name) {
                    let parts = data.display_name.split(',');
                    let shortAddress = parts.slice(0, 3).join(',').trim();
                    document.getElementById(elementId).value = shortAddress;
                } else {
                    document.getElementById(elementId).value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                }
            })
            .catch(() => {
                document.getElementById(elementId).value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        }

        function useCurrentLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    map.setView([lat, lng], 16);
                    currentMode = 'from';
                    fromCoords = {lat, lng};
                    if (fromMarker) map.removeLayer(fromMarker);
                    fromMarker = L.marker([lat, lng]).addTo(map).bindPopup("Я тут").openPopup();
                    reverseGeocode(lat, lng, 'addressFrom');
                    calculatePrice();
                }, function() {
                    alert("Не вдалося отримати геолокацію.");
                }, {enableHighAccuracy: true});
            } else {
                alert("Геолокація не підтримується.");
            }
        }

        function submitOrder() {
            const phone = document.getElementById('phone').value.trim();
            const addressFrom = document.getElementById('addressFrom').value.trim();
            const addressTo = document.getElementById('addressTo').value.trim();

            if (!phone || phone.length < 9) {
                alert("Введіть номер телефону!");
                return;
            }
            if (!addressFrom || !addressTo) {
                alert("Вкажіть адреси Звідки та Куди!");
                return;
            }

            localStorage.setItem("taxi_user_phone", phone);

            const orderData = {
                phone: phone,
                address_from: addressFrom,
                address_to: addressTo,
                price: finalPrice,
                price_desc: priceDescription,
                lat: fromCoords ? fromCoords.lat : null,
                lng: fromCoords ? fromCoords.lng : null
            };

            if (window.Telegram && window.Telegram.WebApp) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert("Відкривайте додаток через Telegram!");
            }
        }
